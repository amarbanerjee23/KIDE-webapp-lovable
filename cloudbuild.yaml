# Google Cloud Build: build and deploy the self-hosted KIDE web application.
#
# Production authentication is required by default. Cloud Build:
#   1. verifies that kide-database-url:latest exists;
#   2. creates/generates kide-better-auth-secret when necessary;
#   3. grants the Cloud Run runtime identity access to both secrets;
#   4. deploys the revision and sets BETTER_AUTH_URL from the Cloud Run URL;
#   5. requires /api/auth/health to report an operational Better Auth runtime.
#
# Set _REQUIRE_AUTH=false only for an intentional public/demo deployment.

substitutions:
  _REGION: us-central1
  _REPOSITORY: kide
  _SERVICE: kide-webapp
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/kide/kide-webapp
  _DATABASE_SECRET: kide-database-url
  _AUTH_SECRET: kide-better-auth-secret
  _CLOUD_SQL_INSTANCE: kide-web-app
  _REQUIRE_AUTH: "true"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - "${_IMAGE}:${COMMIT_SHA}"
      - -t
      - "${_IMAGE}:latest"
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_IMAGE}:${COMMIT_SHA}"

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_IMAGE}:latest"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: auth-secret-preflight
    entrypoint: bash
    args:
      - -ceu
      - |
        READY_FILE=/workspace/.kide-auth-secrets-ready
        CLOUD_SQL_FILE=/workspace/.kide-cloud-sql-connection
        rm -f "$$READY_FILE" "$$CLOUD_SQL_FILE"

        gcloud services enable secretmanager.googleapis.com sqladmin.googleapis.com \
          --project="${PROJECT_ID}" >/dev/null

        if [[ -n "${_CLOUD_SQL_INSTANCE}" ]]; then
          printf '%s' "${PROJECT_ID}:${_REGION}:${_CLOUD_SQL_INSTANCE}" > "$$CLOUD_SQL_FILE"
          echo "Cloud SQL connection configured for the hosted KIDE runtime."
        fi

        secret_exists() {
          gcloud secrets describe "$$1" \
            --project="${PROJECT_ID}" >/dev/null 2>&1
        }

        secret_version_exists() {
          gcloud secrets versions describe latest \
            --project="${PROJECT_ID}" \
            --secret="$$1" \
            --format='value(name)' >/dev/null 2>&1
        }

        ensure_secret() {
          local name="$$1"
          if ! secret_exists "$$name"; then
            gcloud secrets create "$$name" \
              --project="${PROJECT_ID}" \
              --replication-policy=automatic >/dev/null
            echo "Created Secret Manager secret $$name."
          fi
        }

        runtime_service_account="$$(gcloud run services describe "${_SERVICE}" \
          --region "${_REGION}" \
          --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)
        if [[ -z "$$runtime_service_account" ]]; then
          project_number="$$(gcloud projects describe "${PROJECT_ID}" \
            --format='value(projectNumber)')
          runtime_service_account="$${project_number}-compute@developer.gserviceaccount.com"
        fi

        ensure_secret "${_AUTH_SECRET}"
        if ! secret_version_exists "${_AUTH_SECRET}"; then
          auth_value="$$(openssl rand -base64 48 | tr -d '\n')"
          printf '%s' "$$auth_value" | gcloud secrets versions add "${_AUTH_SECRET}" \
            --project="${PROJECT_ID}" \
            --data-file=- >/dev/null
          unset auth_value
          echo "Generated the initial Better Auth signing secret."
        else
          echo "Better Auth signing secret already has a version."
        fi

        gcloud secrets add-iam-policy-binding "${_AUTH_SECRET}" \
          --project="${PROJECT_ID}" \
          --member="serviceAccount:$$runtime_service_account" \
          --role=roles/secretmanager.secretAccessor \
          --quiet >/dev/null

        if secret_version_exists "${_DATABASE_SECRET}"; then
          echo "Database secret version is present."
          gcloud secrets add-iam-policy-binding "${_DATABASE_SECRET}" \
            --project="${PROJECT_ID}" \
            --member="serviceAccount:$$runtime_service_account" \
            --role=roles/secretmanager.secretAccessor \
            --quiet >/dev/null

          touch "$$READY_FILE"
          echo "Authentication secrets are ready for Cloud Run."
        elif [[ "${_REQUIRE_AUTH}" == "true" ]]; then
          echo "ERROR: Required Secret Manager version ${_DATABASE_SECRET}:latest is missing." >&2
          echo "KIDE production authentication requires persistent PostgreSQL." >&2
          echo "Provision the PostgreSQL secret, then run the bootstrap:" >&2
          echo "  PROJECT_ID=${PROJECT_ID} CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE} CLOUD_SQL_REGION=${_REGION} bash deploy/gcp/bootstrap-auth-secrets.sh" >&2
          echo "The deployment is stopping instead of publishing a revision with nonfunctional sign-in." >&2
          exit 2
        else
          echo "NOTICE: ${_REQUIRE_AUTH}=false; deploying intentionally without authentication."
          echo "No database secret will be attached to this demo/public revision."
        fi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-cloud-run
    entrypoint: bash
    args:
      - -ceu
      - |
        DEPLOY_ARGS=(
          run deploy "${_SERVICE}"
          "--image=${_IMAGE}:${COMMIT_SHA}"
          "--region=${_REGION}"
          --platform=managed
          --allow-unauthenticated
          --port=8080
          --memory=1Gi
          --cpu=1
          --min-instances=0
          --max-instances=10
        )

        if [[ -f /workspace/.kide-auth-secrets-ready ]]; then
          DEPLOY_ARGS+=(
            "--update-secrets=DATABASE_URL=${_DATABASE_SECRET}:latest,BETTER_AUTH_SECRET=${_AUTH_SECRET}:latest"
          )

          if [[ -s /workspace/.kide-cloud-sql-connection ]]; then
            CLOUD_SQL_CONNECTION="$$(cat /workspace/.kide-cloud-sql-connection)"
            DEPLOY_ARGS+=(
              "--add-cloudsql-instances=$$CLOUD_SQL_CONNECTION"
              "--update-env-vars=KIDE_AUTH_DEPLOYMENT_STATE=configured,INSTANCE_UNIX_SOCKET=/cloudsql/$$CLOUD_SQL_CONNECTION"
            )
          else
            DEPLOY_ARGS+=(
              "--update-env-vars=KIDE_AUTH_DEPLOYMENT_STATE=configured"
              "--remove-env-vars=INSTANCE_UNIX_SOCKET"
            )
          fi
        else
          DEPLOY_ARGS+=(
            "--remove-secrets=DATABASE_URL,BETTER_AUTH_SECRET"
            "--update-env-vars=KIDE_AUTH_DEPLOYMENT_STATE=unconfigured"
          )
        fi

        gcloud "$${DEPLOY_ARGS[@]}"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: configure-and-verify-auth
    entrypoint: bash
    args:
      - -ceu
      - |
        SERVICE_URL="$$(gcloud run services describe "${_SERVICE}" \
          --region "${_REGION}" \
          --format='value(status.url)')
        test -n "$$SERVICE_URL"

        gcloud run services update "${_SERVICE}" \
          --region "${_REGION}" \
          --update-env-vars "BETTER_AUTH_URL=$$SERVICE_URL"

        echo "KIDE deployed at $$SERVICE_URL"

        if [[ -f /workspace/.kide-auth-secrets-ready ]]; then
          ready=0
          for attempt in $$(seq 1 60); do
            http_code="$$(curl --silent --show-error \
              --output /workspace/auth-health.json \
              --write-out '%{http_code}' \
              --max-time 10 \
              "$$SERVICE_URL/api/auth/health" || true)"

            if [[ "$$http_code" == "200" ]] && \
               grep -Eq '"operational"[[:space:]]*:[[:space:]]*true' /workspace/auth-health.json; then
              ready=1
              break
            fi

            echo "Waiting for operational Better Auth runtime (attempt $$attempt/60, HTTP $$http_code)..."
            sleep 2
          done

          if [[ "$$ready" != "1" ]]; then
            echo "ERROR: Cloud Run deployed, but Better Auth did not become operational." >&2
            echo "If this deployment uses Cloud SQL, verify the runtime service account has roles/cloudsql.client" >&2
            echo "and re-run deploy/gcp/bootstrap-auth-secrets.sh before retrying the build." >&2
            echo "Safe readiness response:" >&2
            cat /workspace/auth-health.json >&2 || true
            exit 1
          fi

          echo "Better Auth runtime and PostgreSQL schema are operational."
        else
          echo "Authentication intentionally disabled for this deployment."
        fi

images:
  - ${_IMAGE}:${COMMIT_SHA}
  - ${_IMAGE}:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
