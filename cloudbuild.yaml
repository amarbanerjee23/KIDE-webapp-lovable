# Google Cloud Build: build the KIDE web app container and deploy it to Cloud Run.
#
# One-time setup (once per GCP project):
#   1. gcloud services enable cloudbuild.googleapis.com run.googleapis.com artifactregistry.googleapis.com
#   2. gcloud artifacts repositories create <repo> --repository-format=docker --location=<region>
#   3. Grant the Cloud Build service account the "Cloud Run Admin" and "Service Account User" roles.
#   4. Create a trigger on this repo (or run: gcloud builds submit --config cloudbuild.yaml).
#
# Override any _ substitution below in your trigger settings.

substitutions:
  _REGION: us-central1
  _REPOSITORY: kide
  _SERVICE: kide-webapp
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/kide/kide-webapp
  # Backend connection (public client settings — safe to keep as plain substitutions).
  _VITE_SUPABASE_URL: https://pkydzfnmrqibtivkcqwn.supabase.co
  _VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_oEGHNY94VGsf6rJUvoikVg_CM4a0hdW
  _VITE_SUPABASE_PROJECT_ID: pkydzfnmrqibtivkcqwn

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg=VITE_SUPABASE_PUBLISHABLE_KEY=${_VITE_SUPABASE_PUBLISHABLE_KEY}
      - --build-arg=VITE_SUPABASE_PROJECT_ID=${_VITE_SUPABASE_PROJECT_ID}
      - -t
      - "${_IMAGE}:${COMMIT_SHA}"
      - -t
      - "${_IMAGE}:latest"
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_IMAGE}:${COMMIT_SHA}"

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_IMAGE}:latest"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - "--image=${_IMAGE}:${COMMIT_SHA}"
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=VITE_SUPABASE_URL=${_VITE_SUPABASE_URL},VITE_SUPABASE_PUBLISHABLE_KEY=${_VITE_SUPABASE_PUBLISHABLE_KEY},VITE_SUPABASE_PROJECT_ID=${_VITE_SUPABASE_PROJECT_ID}

images:
  - ${_IMAGE}:${COMMIT_SHA}
  - ${_IMAGE}:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
