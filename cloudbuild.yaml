# Google Cloud Build: build and deploy the self-hosted KIDE web application.
#
# Required Secret Manager secrets:
#   kide-database-url       -> PostgreSQL DATABASE_URL
#   kide-better-auth-secret -> random Better Auth secret, at least 32 characters
#
# The Cloud Run runtime service account needs Secret Manager Secret Accessor on
# those two secrets. No Supabase project, URL or API key is required.

substitutions:
  _REGION: us-central1
  _REPOSITORY: kide
  _SERVICE: kide-webapp
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/kide/kide-webapp
  _DATABASE_SECRET: kide-database-url
  _AUTH_SECRET: kide-better-auth-secret

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - "${_IMAGE}:${COMMIT_SHA}"
      - -t
      - "${_IMAGE}:latest"
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_IMAGE}:${COMMIT_SHA}"

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_IMAGE}:latest"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - "--image=${_IMAGE}:${COMMIT_SHA}"
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - "--set-secrets=DATABASE_URL=${_DATABASE_SECRET}:latest,BETTER_AUTH_SECRET=${_AUTH_SECRET}:latest"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        SERVICE_URL="$(gcloud run services describe "${_SERVICE}" --region "${_REGION}" --format='value(status.url)')"
        test -n "$$SERVICE_URL"
        gcloud run services update "${_SERVICE}" \
          --region "${_REGION}" \
          --update-env-vars "BETTER_AUTH_URL=$$SERVICE_URL"

images:
  - ${_IMAGE}:${COMMIT_SHA}
  - ${_IMAGE}:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
