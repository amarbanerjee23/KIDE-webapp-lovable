name: PR26 lockfile refresh

on:
  push:
    branches:
      - quality/pr26-exhaustive-cicd-assurance
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: quality/pr26-exhaustive-cicd-assurance
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Commit lockfile
        run: |
          if git diff --quiet -- bun.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(pr26): refresh Bun dependency lock"
          git push origin HEAD:quality/pr26-exhaustive-cicd-assurance
