name: Deploy production from approved main

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Exact full lowercase main commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY followed by a space and that exact SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: kide-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy approved main SHA
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    steps:
      - name: Require main workflow dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Only main can be deployed to production." >&2
            exit 1
          }

      - name: Check out exact requested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify current main and successful post-merge CI
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          [[ "$(git rev-parse HEAD)" == "$CURRENT_MAIN_SHA" ]] || {
            echo "Dispatched source is not current main." >&2
            exit 1
          }
          export CURRENT_MAIN_SHA
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&event=push&per_page=100" \
            > /tmp/kide-main-ci-runs.json
          node scripts/release/validate-deploy-authorization.mjs /tmp/kide-main-ci-runs.json

      - name: Validate Cloud Build deployment contract
        shell: bash
        run: bash scripts/ci/validate-deployment-contract.sh

      - name: Require production GCP identity configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_PRODUCTION_SERVICE_ACCOUNT: ${{ secrets.GCP_PRODUCTION_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GCP_PROJECT_ID" ]] || { echo "Production GCP_PROJECT_ID variable is required." >&2; exit 1; }
          [[ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]] || { echo "GCP_WORKLOAD_IDENTITY_PROVIDER is required." >&2; exit 1; }
          [[ -n "$GCP_PRODUCTION_SERVICE_ACCOUNT" ]] || { echo "GCP_PRODUCTION_SERVICE_ACCOUNT is required." >&2; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PRODUCTION_SERVICE_ACCOUNT }}

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: ">= 390.0.0"

      - name: Deploy exact commit with Cloud Build
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          GCP_CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
        shell: bash
        run: |
          set -euo pipefail
          region="${GCP_REGION:-us-central1}"
          service="${GCP_SERVICE_NAME:-kide-webapp}"
          repository="${GCP_ARTIFACT_REPOSITORY:-kide}"
          database="${GCP_CLOUD_SQL_INSTANCE:-kide-web-app}"
          image="$region-docker.pkg.dev/$GCP_PROJECT_ID/$repository/$service"
          # COMMIT_SHA is not populated automatically for source-upload builds.
          # Supplying it explicitly ensures every image and revision is bound to main.
          gcloud builds submit . \
            --quiet \
            --project="$GCP_PROJECT_ID" \
            --region="$region" \
            --config=cloudbuild.yaml \
            --substitutions="COMMIT_SHA=$GITHUB_SHA,SHORT_SHA=${GITHUB_SHA:0:7},_REGION=$region,_SERVICE=$service,_REPOSITORY=$repository,_IMAGE=$image,_BOOTSTRAP_CLOUD_SQL=true,_REQUIRE_AUTH=true,_CLOUD_SQL_INSTANCE=$database"

          {
            echo "KIDE_DEPLOY_REGION=$region"
            echo "KIDE_DEPLOY_SERVICE=$service"
            echo "KIDE_DEPLOY_REPOSITORY=$repository"
            echo "KIDE_DEPLOY_SQL_INSTANCE=$database"
          } >> "$GITHUB_ENV"

      - name: Prove live revision and registry image identity
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          service_url="$(gcloud run services describe "$KIDE_DEPLOY_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$KIDE_DEPLOY_REGION" \
            --format='value(status.url)')"
          [[ -n "$service_url" ]] || { echo "Deployed Cloud Run URL missing." >&2; exit 1; }
          REGION="$KIDE_DEPLOY_REGION" \
          SERVICE_NAME="$KIDE_DEPLOY_SERVICE" \
          CLOUD_SQL_INSTANCE="$KIDE_DEPLOY_SQL_INSTANCE" \
          ARTIFACT_REPOSITORY="$KIDE_DEPLOY_REPOSITORY" \
          KIDE_URL="$service_url" \
          OUTPUT_FILE="deployment-evidence/deployment-${GITHUB_SHA}.json" \
            bash deploy/gcp/qualify-live-deployment.sh

      - name: Upload verified deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: verified-production-deploy-${{ github.sha }}
          path: deployment-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Summarize required next release gate
        shell: bash
        run: |
          {
            echo "## Exact main production deployment verified"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Project: \`${{ vars.GCP_PROJECT_ID }}\`"
            echo "- Service: \`$KIDE_DEPLOY_SERVICE\`"
            echo "- Cloud Run image digest and runtime config verified"
            echo
            echo "**Next:** run Production deployment qualification from this same main SHA"
            echo "with the completed restore-drill reference, then use its run ID in Publish official release."
          } >> "$GITHUB_STEP_SUMMARY"
