name: Publish official release

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful Production deployment qualification workflow run ID for current main
        required: true
        type: string
      confirmation:
        description: Type PUBLISH v1.0.0
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: official-release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Validate acceptance and publish v1.0.0
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check confirmation
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$RELEASE_CONFIRMATION" != "PUBLISH v1.0.0" ]]; then
            echo "Release publication confirmation did not match exactly." >&2
            exit 1
          fi

      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Load exact production qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse HEAD)"

          [[ "$QUALIFICATION_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "qualification_run_id must be a numeric GitHub Actions run ID." >&2
            exit 1
          }

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}" \
            > /tmp/qualification-run.json

          node - "$main_sha" /tmp/qualification-run.json <<'JS'
          const fs = require("fs");
          const [expectedSha, path] = process.argv.slice(2);
          const run = JSON.parse(fs.readFileSync(path, "utf8"));
          if (run.name !== "Production deployment qualification") {
            throw new Error(`Run ${run.id} is not the production qualification workflow`);
          }
          if (run.event !== "workflow_dispatch" || run.head_branch !== "main") {
            throw new Error("Production qualification must be manually dispatched from main");
          }
          if (run.head_sha !== expectedSha) {
            throw new Error(
              `Qualification commit ${run.head_sha} does not match current main ${expectedSha}`,
            );
          }
          if (run.status !== "completed" || run.conclusion !== "success") {
            throw new Error(`Production qualification run ${run.id} did not succeed`);
          }
          console.log(`Verified production qualification run #${run.run_number} (${run.html_url})`);
          JS

          rm -rf /tmp/qualification-evidence
          mkdir -p /tmp/qualification-evidence
          gh run download "$QUALIFICATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "production-qualification-$main_sha" \
            --dir /tmp/qualification-evidence

          mapfile -t evidence_files < <(
            find /tmp/qualification-evidence -type f -name "launch-acceptance-$main_sha.json" -print
          )
          if (( ${#evidence_files[@]} != 1 )); then
            echo "Expected exactly one launch acceptance JSON in qualification evidence." >&2
            exit 1
          fi
          cp "${evidence_files[0]}" /tmp/kide-launch-acceptance.json

      - name: Validate acceptance against current main
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse HEAD)"
          ACCEPTANCE_FILE=/tmp/kide-launch-acceptance.json \
            EXPECTED_COMMIT_SHA="$main_sha" \
            bash scripts/release/validate-publication.sh

      - name: Require successful main CI for accepted commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&event=push&per_page=50" \
            > /tmp/main-runs.json

          node - "$sha" /tmp/main-runs.json <<'JS'
          const fs = require("fs");
          const [sha, path] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(path, "utf8"));
          const run = payload.workflow_runs?.find(
            (entry) =>
              entry.head_sha === sha &&
              entry.name === "CI" &&
              entry.status === "completed" &&
              entry.conclusion === "success",
          );
          if (!run) {
            throw new Error(`No successful main CI run found for ${sha}`);
          }
          console.log(`Verified successful main CI run #${run.run_number} (${run.html_url})`);
          JS

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          node - <<'JS' >> "$GITHUB_ENV"
          const release = require("./release.json");
          console.log(`RELEASE_VERSION=${release.releaseVersion}`);
          console.log(`RELEASE_TAG=${release.tag}`);
          JS

      - name: Refuse to overwrite an existing release tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Build release publication notes
        run: |
          set -euo pipefail
          acceptance_sha="$(sha256sum /tmp/kide-launch-acceptance.json | awk '{print $1}')"
          {
            cat "docs/releases/v${RELEASE_VERSION}.md"
            echo
            echo "---"
            echo
            printf 'Release commit: `%s`\n' "$(git rev-parse HEAD)"
            echo
            printf 'Launch acceptance evidence SHA-256: `%s`\n' "$acceptance_sha"
          } > /tmp/kide-release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --target "$(git rev-parse HEAD)" \
            --title "KIDE ${RELEASE_VERSION}" \
            --notes-file /tmp/kide-release-notes.md

      - name: Record publication summary
        run: |
          {
            echo "## KIDE ${RELEASE_VERSION} published"
            echo
            printf -- '- Tag: `%s`\n' "$RELEASE_TAG"
            printf -- '- Commit: `%s`\n' "$(git rev-parse HEAD)"
            echo "- Acceptance evidence came from a successful production qualification run for current main and was validated alongside successful main CI."
          } >> "$GITHUB_STEP_SUMMARY"
