name: PR26 format

on:
  push:
    branches:
      - quality/pr26-exhaustive-cicd-assurance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: quality/pr26-exhaustive-cicd-assurance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format PR26 files
        shell: bash
        run: |
          git fetch --no-tags origin main
          mapfile -t format_files < <(
            git diff --name-only --diff-filter=ACMR origin/main...HEAD -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.md' '*.yaml' '*.yml'
          )
          if (( ${#format_files[@]} > 0 )); then
            bunx prettier --write "${format_files[@]}"
          fi

          mapfile -t lint_files < <(
            git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx'
          )
          if (( ${#lint_files[@]} > 0 )); then
            bunx eslint --fix "${lint_files[@]}"
          fi

          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(pr26): format CI and test additions"
          git push origin HEAD:quality/pr26-exhaustive-cicd-assurance
