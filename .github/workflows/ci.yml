name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Strict TypeScript check
        run: bunx tsc --noEmit

      - name: Run frontend unit tests
        run: bunx vitest run

      - name: Build production application
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder

  synthesis-service:
    name: Synthesis service — compile, unit test, container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/synthesis-worker
    env:
      CELERY_BROKER_URL: memory://
      JENA_QUERY_URL: http://jena.invalid:3030/kide/query
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/synthesis-worker/requirements.txt

      - name: Install service dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q kide_worker tests

      - name: Run synthesis unit tests
        run: python -m unittest discover -s tests -v

      - name: Build synthesis container
        run: docker build --pull -t kide-synthesis-worker:ci .

  platform-manifests:
    name: Platform — Helm lint, render, container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint Helm chart
        run: helm lint deploy/helm/kide-platform

      - name: Render Helm chart
        run: |
          helm template kide-ci deploy/helm/kide-platform > /tmp/kide-platform.yaml
          test -s /tmp/kide-platform.yaml
          grep -q "kind: StatefulSet" /tmp/kide-platform.yaml
          grep -q "name: synthesis-worker" /tmp/kide-platform.yaml
          grep -q "name: jena" /tmp/kide-platform.yaml

      - name: Client-side Kubernetes validation
        run: kubectl apply --dry-run=client --validate=false -f /tmp/kide-platform.yaml

      - name: Build Jena Fuseki container
        run: docker build --pull --build-arg JENA_VERSION=6.2.0 -t kide-jena-fuseki:ci services/jena-fuseki
