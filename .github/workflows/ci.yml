name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-webapp:
    name: Standalone Node/TypeScript webapp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce standalone runtime architecture
        shell: bash
        run: |
          test ! -e services/synthesis-worker
          test ! -e services/jena-fuseki
          test ! -e deploy/helm/kide-platform
          if git ls-files | grep -E '(^|/)(pom\.xml|requirements\.txt)$|\.(py|java)

      - name: Lint changed JavaScript and TypeScript
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx')
          if (( ${#files[@]} > 0 )); then
            printf 'Linting %s\n' "${files[@]}"
            bunx eslint "${files[@]}"
          else
            echo "No changed JavaScript or TypeScript files."
          fi

      - name: Strict TypeScript check
        run: bunx tsc --noEmit

      - name: Run full test suite
        run: bunx vitest run

      - name: Build production application
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder

      - name: Build standalone production container
        run: |
          docker build --pull             --build-arg VITE_SUPABASE_URL=https://placeholder.supabase.co             --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=placeholder             --build-arg VITE_SUPABASE_PROJECT_ID=placeholder             -t kide-standalone:ci .
 >/dev/null; then
            echo "Tracked non-Node application runtime files are not allowed in the standalone webapp."
            git ls-files | grep -E '(^|/)(pom\.xml|requirements\.txt)$|\.(py|java)

      - name: Lint changed JavaScript and TypeScript
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx')
          if (( ${#files[@]} > 0 )); then
            printf 'Linting %s\n' "${files[@]}"
            bunx eslint "${files[@]}"
          else
            echo "No changed JavaScript or TypeScript files."
          fi

      - name: Strict TypeScript check
        run: bunx tsc --noEmit

      - name: Run full test suite
        run: bunx vitest run

      - name: Build production application
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder

      - name: Build standalone production container
        run: |
          docker build --pull             --build-arg VITE_SUPABASE_URL=https://placeholder.supabase.co             --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=placeholder             --build-arg VITE_SUPABASE_PROJECT_ID=placeholder             -t kide-standalone:ci .

            exit 1
          fi

      - name: Lint changed JavaScript and TypeScript
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx')
          if (( ${#files[@]} > 0 )); then
            printf 'Linting %s\n' "${files[@]}"
            bunx eslint "${files[@]}"
          else
            echo "No changed JavaScript or TypeScript files."
          fi

      - name: Strict TypeScript check
        run: bunx tsc --noEmit

      - name: Run full test suite
        run: bunx vitest run

      - name: Build production application
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder

      - name: Build standalone production container
        run: |
          docker build --pull             --build-arg VITE_SUPABASE_URL=https://placeholder.supabase.co             --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=placeholder             --build-arg VITE_SUPABASE_PROJECT_ID=placeholder             -t kide-standalone:ci .
