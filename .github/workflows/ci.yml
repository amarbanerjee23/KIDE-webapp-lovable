name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-compute-webapp:
    name: Client-compute Node/TypeScript webapp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "${GITHUB_HEAD_REF:-}" == "auth/pr24-better-auth-postgres" ]]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Normalize PR24 dependency and formatting state
        if: github.head_ref == 'auth/pr24-better-auth-postgres'
        shell: bash
        run: |
          mapfile -t format_files < <(
            git diff --name-only --diff-filter=ACMR origin/main...HEAD -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.md' '*.yaml' '*.yml'
          )
          if (( ${#format_files[@]} > 0 )); then
            bunx prettier --write "${format_files[@]}"
          fi

          # Loading Vite runs TanStack Router's file-route generator. The build
          # may still expose later migration errors; route generation itself is
          # needed before the strict TypeScript check sees newly added routes.
          bun run build >/tmp/pr24-route-generation.log 2>&1 || true

          git add bun.lock src/routeTree.gen.ts
          if (( ${#format_files[@]} > 0 )); then
            git add "${format_files[@]}"
          fi

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(pr24): refresh lockfile and formatting"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Enforce client-compute architecture
        shell: bash
        run: |
          test -f docs/architecture/client-compute-reference.md
          test ! -e services/synthesis-worker
          test ! -e services/jena-fuseki
          test ! -e deploy/helm/kide-platform
          test ! -e src/lib/kide/standalone-synthesis.functions.ts
          test ! -e src/lib/kide/standalone-synthesis.server.ts

          forbidden_runtime="$(git ls-files | grep -E '(^|/)(pom\.xml|requirements\.txt)$|\.(py|java)$' || true)"
          if [[ -n "$forbidden_runtime" ]]; then
            echo "Tracked non-TypeScript application runtimes are not allowed."
            printf '%s\n' "$forbidden_runtime"
            exit 1
          fi

          kide_server_compute="$(git grep -n 'createServerFn' -- src/lib/kide || true)"
          if [[ -n "$kide_server_compute" ]]; then
            echo "KIDE domain computation must stay in the browser; createServerFn is forbidden under src/lib/kide."
            printf '%s\n' "$kide_server_compute"
            exit 1
          fi

          server_domain_imports="$(
            git grep -nE 'from "@/lib/(dsl|kide/)' -- 'src/lib/*.functions.ts' 'src/lib/*.server.ts' || true
          )"
          if [[ -n "$server_domain_imports" ]]; then
            echo "Backend I/O functions must not import KIDE computational modules."
            printf '%s\n' "$server_domain_imports"
            exit 1
          fi

      - name: Lint changed JavaScript and TypeScript
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx')
          if (( ${#files[@]} > 0 )); then
            printf 'Linting %s\n' "${files[@]}"
            bunx eslint "${files[@]}"
          else
            echo "No changed JavaScript or TypeScript files."
          fi

      - name: Strict TypeScript check
        run: bunx tsc --noEmit

      - name: Run full test suite
        run: bunx vitest run

      - name: Build production application
        run: bun run build

      - name: Build production container
        shell: bash
        run: |
          set -o pipefail
          docker build --pull -t kide-webapp:ci . 2>&1 | tee /tmp/kide-docker-build.log

          if grep -q "SecretsUsedInArgOrEnv" /tmp/kide-docker-build.log; then
            echo "Docker build emitted a secret-like ARG/ENV warning."
            exit 1
          fi
