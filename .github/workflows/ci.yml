name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-compute-webapp:
    name: Client-compute Node/TypeScript webapp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce client-compute architecture
        shell: bash
        run: |
          test -f docs/architecture/client-compute-reference.md
          test ! -e services/synthesis-worker
          test ! -e services/jena-fuseki
          test ! -e deploy/helm/kide-platform
          test ! -e src/lib/kide/standalone-synthesis.functions.ts
          test ! -e src/lib/kide/standalone-synthesis.server.ts
          test ! -e src/integrations/supabase
          ! grep -q '"@supabase/supabase-js"' package.json

          stale_baas_refs="$(
            git grep -nE '@supabase/supabase-js|integrations/supabase|VITE_SUPABASE_|SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_PUBLISHABLE_KEY|@lovable\.dev/cloud-auth-js' -- src Dockerfile cloudbuild.yaml package.json || true
          )"
          if [[ -n "$stale_baas_refs" ]]; then
            echo "Hosted-BaaS runtime references are forbidden after PR24."
            printf '%s\n' "$stale_baas_refs"
            exit 1
          fi

          forbidden_runtime="$(git ls-files | grep -E '(^|/)(pom\.xml|requirements\.txt)$|\.(py|java)$' || true)"
          if [[ -n "$forbidden_runtime" ]]; then
            echo "Tracked non-TypeScript application runtimes are not allowed."
            printf '%s\n' "$forbidden_runtime"
            exit 1
          fi

          kide_server_compute="$(git grep -n 'createServerFn' -- src/lib/kide || true)"
          if [[ -n "$kide_server_compute" ]]; then
            echo "KIDE domain computation must stay in the browser; createServerFn is forbidden under src/lib/kide."
            printf '%s\n' "$kide_server_compute"
            exit 1
          fi

          server_domain_imports="$(
            git grep -nE 'from "@/lib/(dsl|kide/)' -- 'src/lib/*.functions.ts' 'src/lib/*.server.ts' || true
          )"
          if [[ -n "$server_domain_imports" ]]; then
            echo "Backend I/O functions must not import KIDE computational modules."
            printf '%s\n' "$server_domain_imports"
            exit 1
          fi

      - name: Lint changed JavaScript and TypeScript
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx')
          if (( ${#files[@]} > 0 )); then
            printf 'Linting %s\n' "${files[@]}"
            bunx eslint "${files[@]}"
          else
            echo "No changed JavaScript or TypeScript files."
          fi

      - name: Strict TypeScript check
        run: bunx tsc --noEmit

      - name: Run full test suite
        run: bunx vitest run

      - name: Build production application
        run: bun run build

      - name: Build production container
        shell: bash
        run: |
          set -o pipefail
          docker build --pull -t kide-webapp:ci . 2>&1 | tee /tmp/kide-docker-build.log

          if grep -q "SecretsUsedInArgOrEnv" /tmp/kide-docker-build.log; then
            echo "Docker build emitted a secret-like ARG/ENV warning."
            exit 1
          fi
