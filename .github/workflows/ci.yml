name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend — changed lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed JavaScript and TypeScript
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx')
          if (( ${#files[@]} > 0 )); then
            printf 'Linting %s\n' "${files[@]}"
            bunx eslint "${files[@]}"
          else
            echo "No changed JavaScript or TypeScript files."
          fi

      - name: Strict TypeScript check
        run: bunx tsc --noEmit

      - name: Run frontend unit tests
        run: bunx vitest run

      - name: Build production application
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder

  language-service:
    name: Language service — Java test, package, container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/kide-lsp
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/kide-lsp/pom.xml

      - name: Run language service tests and package
        run: mvn -B -ntp verify

      - name: Build language service container
        run: docker build --pull -t kide-lsp-transport:ci .

  synthesis-service:
    name: Synthesis service — compile, unit test, container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/synthesis-worker
    env:
      CELERY_BROKER_URL: memory://
      JENA_QUERY_URL: http://jena.invalid:3030/kide/query
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/synthesis-worker/requirements.txt

      - name: Install service dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q kide_worker tests

      - name: Run synthesis unit tests
        run: python -m unittest discover -s tests -v

      - name: Build synthesis container
        run: docker build --pull -t kide-synthesis-worker:ci .

  platform-manifests:
    name: Platform — Helm, schema validation, container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint Helm chart
        run: helm lint --strict deploy/helm/kide-platform

      - name: Render Helm chart
        run: |
          helm template kide-ci deploy/helm/kide-platform > /tmp/kide-platform.yaml
          test -s /tmp/kide-platform.yaml
          grep -q "kind: StatefulSet" /tmp/kide-platform.yaml
          grep -q "name: synthesis-worker" /tmp/kide-platform.yaml
          grep -q "name: jena" /tmp/kide-platform.yaml
          grep -q "name: kide-lsp" /tmp/kide-platform.yaml

      - name: Validate rendered Kubernetes schemas offline
        run: |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7             -strict -summary < /tmp/kide-platform.yaml

      - name: Build Jena Fuseki container
        run: docker build --pull --build-arg JENA_VERSION=6.2.0 -t kide-jena-fuseki:ci services/jena-fuseki
